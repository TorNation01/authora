# AUTHORA Nginx reverse proxy (Option 2)
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
# authora.studio=marketing, app.authora.studio=app, api.authora.studio=API

# Upstreams
upstream authora_api {
    server 127.0.0.1:8000;
}

upstream authora_web {
    server 127.0.0.1:3000;
}

# API subdomain
server {
    listen 80;
    listen [::]:80;
    server_name api.authora.studio;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.authora.studio;

    ssl_certificate /etc/letsencrypt/live/api.authora.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.authora.studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://authora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# www redirect
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.authora.studio;
    ssl_certificate /etc/letsencrypt/live/authora.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/authora.studio/privkey.pem;
    return 301 https://authora.studio$request_uri;
}

# Marketing (authora.studio)
